dataset:
  manifest: data/processed/v6_3_continuous_onset/manifest.csv
  guitarset_root: data/GuitarSet
  sample_rate: 44100
  hop_size: 256
  window_size: 512
  positive_hops: 2
  min_pitch: 40
  max_pitch: 76
  seed: 42
  normalization_percentile: 95.0
  normalization_target: 0.8
  max_gain: 16.0

train:
  run_name: onset_v6_3_1_temporal_pool
  output_root: runs/v6
  epochs: 15
  batch_size: 128
  inference_batch_size: 1024
  learning_rate: 0.001
  early_stopping_patience: 5
  reduce_lr_patience: 2
  min_learning_rate: 0.000001

model:
  channels: 24
  dropout: 0.10
  pooling: temporal_bins

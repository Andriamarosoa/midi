[project]
name = "midi"
version = "0.1.0"
description = "Audio and harmonic processing tools"
requires-python = ">=3.9,<3.10"

dependencies = [
    "numpy>=1.23,<2.0",
    "scipy>=1.9,<1.14",
    "soundfile>=0.12,<0.14",
    "jams>=0.3.4,<0.4",
    "pandas>=1.5,<2.2",
    "librosa>=0.10,<0.11",
    "matplotlib>=3.6,<3.9",
    "tqdm>=4.64,<5"
]

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["src"]
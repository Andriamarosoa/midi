[project]
name = "midi"
version = "1.0.0"
description = "Causal clean monophonic guitar audio-to-MIDI product"
requires-python = ">=3.9,<3.10"

dependencies = [
    "numpy>=1.23,<2.0",
    "scipy>=1.9,<1.14",
    "soundfile>=0.12,<0.14",
    "jams>=0.3.4,<0.4",
    "pandas>=1.5,<2.2",
    "librosa>=0.10,<0.11",
    "matplotlib>=3.6,<3.9",
    "tqdm>=4.64,<5",
    "sounddevice>=0.4.6,<0.6",
    "pyfluidsynth>=1.3.6,<2",
    "tensorflow>=2.15,<2.16",
    "PyYAML>=6,<7",
]

[project.scripts]
guitar-midi = "src.product.live:main"
guitar-midi-transcribe = "src.product.transcribe:main"
guitar-midi-poly = "src.polyphonic.live:main"
guitar-midi-poly-transcribe = "src.polyphonic.transcribe:main"

[build-system]
requires = ["setuptools>=70"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]

dataset:
  manifest: data/processed/polyphonic_v2_0/manifest.csv
  seed: 42
  input_samples: 4096
  normalization_gain: 1.4932045250002872

train:
  run_name: polyphonic_v2_0_guitarset
  output_root: runs/polyphonic
  epochs: 15
  batch_size: 64
  examples_per_epoch: 240000
  validation_examples: 60000
  learning_rate: 0.0005
  minimum_learning_rate: 0.000001
  early_stopping_patience: 5
  reduce_lr_patience: 2
  maximum_frame_weight: 12.0
  maximum_onset_weight: 20.0
  workers: 1
  sampling_fractions:
    onset: 0.30
    polyphonic: 0.30
    monophonic: 0.25
    silence: 0.15

model:
  channels: 32
  tcn_blocks: 4
  dropout: 0.10
  dense_units: 128
  harmonic_offset_scale_cents: 35.0
  onset_loss_weight: 0.50
  harmonic_amplitude_loss_weight: 0.05
  harmonic_offset_loss_weight: 0.01

initialization:
  mono_checkpoint: runs/v6/pitch_v6_0_guitarset_active_20260717_134759/best_pitch.keras

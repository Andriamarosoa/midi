dataset:
  manifest: data/processed/v5_2/manifest.csv
  min_pitch: 40
  max_pitch: 76
  train_players: ["00", "01", "02", "03"]
  validation_players: ["04"]
  test_players: ["05"]
  seed: 42
  sample_rate: 44100
  hop_size: 256
  max_window: 4096
  normalization_percentile: 95.0
  normalization_target: 0.8
  max_gain: 16.0

cache:
  mode: ram
  validate_schema: true

train:
  run_name: pitch_v5_2
  output_root: runs/v5
  epochs: 15
  batch_size: 32
  learning_rate: 0.001
  early_stopping_patience: 5
  reduce_lr_patience: 2
  min_learning_rate: 0.000001
  workers: 1
  use_class_weights: false
  max_class_weight: 10.0

model:
  channels: 32
  tcn_blocks: 4
  dropout: 0.10
  dense_units: 128
  pooling: hybrid

evaluation:
  make_plots: true
  save_predictions: false
